<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>राजा हिन्दुस्तानी</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}


/* =====================================================
   MAIN HERO / BACKGROUND
===================================================== */

.hero {

    position: relative;

    width: 100vw;
    height: 100vh;

    background-image:
        linear-gradient(
            rgba(10, 7, 4, 0.05),
            rgba(10, 7, 4, 0.28)
        ),
        url("bg.jpg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    overflow: hidden;

    animation:
        backgroundZoom 20s
        ease-in-out
        infinite alternate;
}


@keyframes backgroundZoom {

    from {
        background-size: 100% auto;
    }

    to {
        background-size: 104% auto;
    }

}


/* =====================================================
   CINEMATIC VIGNETTE
===================================================== */

.hero::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 35%,
            rgba(0,0,0,.28) 100%
        );

    z-index: 1;

    pointer-events: none;
}


/* =====================================================
   FILM GRAIN
===================================================== */

.grain {

    position: absolute;

    inset: -50%;

    width: 200%;
    height: 200%;

    z-index: 30;

    opacity: .045;

    pointer-events: none;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

    animation:
        grainMove .2s
        steps(2)
        infinite;
}


@keyframes grainMove {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(2%,-1%);
    }

    50% {
        transform: translate(-1%,2%);
    }

    75% {
        transform: translate(1%,1%);
    }

    100% {
        transform: translate(-2%,-2%);
    }

}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    position: absolute;

    z-index: 10;

    top: 27px;

    left: 28px;
    right: 28px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    font-weight: 600;
}


/* =====================================================
   CLOCK
===================================================== */

.time {

    font-size: 16px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.8);
}


/* =====================================================
   ONLINE
===================================================== */

.online {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 15px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);
}


.online-dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #21e890;

    box-shadow:
        0 0 8px #21e890,
        0 0 18px rgba(33,232,144,.55);

    animation:
        onlinePulse 2s infinite;
}


@keyframes onlinePulse {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .55;
        transform: scale(.8);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =====================================================
   MUSIC LINKS
===================================================== */

.music-links {

    display: flex;

    align-items: center;

    gap: 24px;
}


.music-links a {

    color: white;

    text-decoration: none;

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 14px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    transition: .25s ease;
}


.music-links a:hover {

    transform:
        translateY(-2px);

    opacity: .75;
}


/* =====================================================
   RAJA HINDUSTANI TITLE
   REFERENCE POSTER STYLE
===================================================== */

.title-container {

    position: absolute;

    z-index: 5;

    top: 42px;

    left: 50%;

    width: 100%;

    transform:
        translateX(-50%);

    text-align: center;

    pointer-events: none;

    animation:
        titleAppear 1.3s
        ease-out;
}


/* =====================================================
   MAIN TITLE
===================================================== */

.title {

    font-family:
        "Noto Serif Devanagari",
        serif;

    font-size:
        clamp(75px, 9.5vw, 155px);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -5px;

    color: #fff3d2;

    margin: 0;

    /* Main vintage poster shadow */

    text-shadow:

        /* dark outline */
        2px 2px 0 #49351f,

        4px 4px 0 #49351f,

        /* deep shadow */
        7px 7px 0 rgba(35,22,10,.55),

        /* soft shadow */
        0 12px 25px rgba(0,0,0,.55);

    filter:
        drop-shadow(
            0 5px 5px rgba(0,0,0,.35)
        );
}


/* =====================================================
   TITLE APPEAR
===================================================== */

@keyframes titleAppear {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(-15px)
            scale(.95);
    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   HIDDEN YOUTUBE PLAYER
===================================================== */

#youtube-player {

    position: fixed;

    width: 2px;
    height: 2px;

    left: -20px;
    bottom: -20px;

    opacity: .01;

    pointer-events: none;
}


/* =====================================================
   SMALL INDIAN TAXI MUSIC PLAYER
===================================================== */

.player {

    position: absolute;

    z-index: 20;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    width:
        min(500px, calc(100% - 30px));

    min-height: 78px;

    padding:
        9px 13px 9px 9px;

    border-radius: 18px;

    /* Vintage Indian taxi glass */

    background:
        linear-gradient(
            135deg,
            rgba(218,174,57,.74),
            rgba(55,39,17,.73)
        );

    border:
        1px solid
        rgba(255,230,150,.38);

    box-shadow:

        0 12px 35px
        rgba(0,0,0,.32),

        inset 0 1px 1px
        rgba(255,255,255,.2);

    backdrop-filter:
        blur(12px);

    display: flex;

    align-items: center;

    gap: 11px;

    transition: .3s ease;
}


.player:hover {

    transform:
        translateX(-50%)
        translateY(-3px);
}


/* =====================================================
   ALBUM
===================================================== */

.album {

    width: 58px;
    height: 58px;

    flex-shrink: 0;

    border-radius: 10px;

    overflow: hidden;

    border:
        2px solid
        rgba(255,255,255,.55);

    box-shadow:
        0 4px 12px rgba(0,0,0,.4);

    animation:
        albumRotate 10s
        linear
        infinite;

    animation-play-state:
        paused;
}


.album.playing {

    animation-play-state:
        running;
}


.album img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}


@keyframes albumRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =====================================================
   SONG INFO
===================================================== */

.song-info {

    flex: 1;

    min-width: 0;
}


.song-name {

    font-size: 14px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 3px;
}


.artist {

    font-size: 11px;

    opacity: .75;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 6px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-container {

    width: 100%;

    height: 3px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.25);

    cursor: pointer;

    overflow: hidden;
}


.progress {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 10px;

    transition:
        width .2s linear;
}


/* =====================================================
   TIME
===================================================== */

.time-display {

    margin-top: 3px;

    font-size: 9px;

    opacity: .65;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

    display: flex;

    align-items: center;

    gap: 3px;
}


.control {

    width: 27px;
    height: 32px;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 13px;

    transition: .2s;
}


.control:hover {

    transform:
        scale(1.15);
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.play-button {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.95);

    color: #3d2c12;

    font-size: 15px;

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.3);
}


/* =====================================================
   ENTER SCREEN
===================================================== */

.start-screen {

    position: fixed;

    z-index: 100;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(12,8,5,.68);

    backdrop-filter:
        blur(10px);

    transition:
        opacity .7s ease,
        visibility .7s ease;
}


.start-screen.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


.start-content {

    text-align: center;

    animation:
        startFloat 2.2s
        ease-in-out
        infinite alternate;
}


.start-content h2 {

    font-family:
        "Noto Serif Devanagari",
        serif;

    font-size:
        clamp(45px, 7vw, 85px);

    line-height: .95;

    color: #fff3d2;

    text-shadow:

        2px 2px 0 #49351f,

        5px 5px 0
        rgba(35,22,10,.6),

        0 10px 25px
        rgba(0,0,0,.55);

    margin-bottom: 18px;
}


.start-content p {

    font-size: 14px;

    opacity: .72;

    margin-bottom: 28px;
}


.enter-button {

    border:
        1px solid
        rgba(255,255,255,.5);

    color: white;

    background:
        rgba(255,255,255,.12);

    padding:
        14px 32px;

    border-radius: 40px;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

    transition: .3s;
}


.enter-button:hover {

    background: white;

    color: #302312;

    transform:
        scale(1.05);
}


@keyframes startFloat {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(-8px);
    }

}


/* =====================================================
   LOADING
===================================================== */

.loading {

    position: fixed;

    z-index: 150;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #17100d;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}


.loading.hide {

    opacity: 0;

    visibility: hidden;
}


.loader {

    width: 35px;
    height: 35px;

    border:
        3px solid
        rgba(255,255,255,.2);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin .8s
        linear
        infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {


    .top-bar {

        top: 17px;

        left: 17px;
        right: 17px;
    }


    .time {

        font-size: 13px;
    }


    .online {

        font-size: 11px;
    }


    .music-links {

        gap: 9px;
    }


    .music-links span {

        display: none;
    }


    /* MOBILE TITLE */

    .title-container {

        top: 38px;
    }


    .title {

        font-size: 62px;

        line-height: .94;

        letter-spacing: -3px;

        text-shadow:

            2px 2px 0 #49351f,

            4px 4px 0
            rgba(35,22,10,.6),

            0 8px 18px
            rgba(0,0,0,.55);
    }


    /* MOBILE PLAYER */

    .player {

        width:
            calc(100% - 24px);

        bottom: 14px;

        min-height: 68px;

        padding:
            7px 9px 7px 7px;

        border-radius: 15px;

        gap: 8px;
    }


    .album {

        width: 50px;
        height: 50px;
    }


    .song-name {

        font-size: 12px;
    }


    .artist {

        font-size: 9px;
    }


    .controls {

        gap: 0;
    }


    .control {

        width: 24px;

        height: 28px;
    }


    .play-button {

        width: 38px;
        height: 38px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
===================================================== -->

<div
class="loading"
id="loading"
>

    <div class="loader"></div>

</div>


<!-- =====================================================
     ENTER EXPERIENCE
===================================================== -->

<div
class="start-screen"
id="startScreen"
>

    <div class="start-content">

        <h2>
            राजा<br>
            हिन्दुस्तानी
        </h2>

        <p>
            Put on your headphones and enter the memory
        </p>

        <button
        class="enter-button"
        id="enterButton"
        >

            ▶ ENTER EXPERIENCE

        </button>

    </div>

</div>


<!-- =====================================================
     MAIN PAGE
===================================================== -->

<main class="hero">


    <div class="grain"></div>


    <!-- =================================================
         TOP BAR
    ================================================== -->

    <div class="top-bar">


        <div
        class="time"
        id="currentTime"
        >
            2:59 pm
        </div>


        <div class="online">

            <span class="online-dot"></span>

            <span>

                <span id="onlineCount">
                    39
                </span>

                online

            </span>

        </div>


        <div class="music-links">


            <a
            href="https://open.spotify.com/"
            target="_blank"
            >

                ◉

                <span>
                    Spotify ↗
                </span>

            </a>


            <a
            href="https://music.youtube.com/"
            target="_blank"
            >

                ▶

                <span>
                    YT Music ↗
                </span>

            </a>


        </div>

    </div>


    <!-- =================================================
         RAJA HINDUSTANI TITLE
    ================================================== -->

    <div class="title-container">

        <h1 class="title">

            राजा

            <br>

            हिन्दुस्तानी

        </h1>

    </div>


    <!-- =================================================
         HIDDEN YOUTUBE PLAYER
    ================================================== -->

    <div id="youtube-player"></div>


    <!-- =================================================
         MUSIC PLAYER
    ================================================== -->

    <div class="player">


        <div
        class="album"
        id="album"
        >

            <img
            id="albumImage"
            src="bg.jpg"
            alt="Raja Hindustani"
            >

        </div>


        <div class="song-info">


            <div
            class="song-name"
            id="songName"
            >
                Raja Hindustani
            </div>


            <div
            class="artist"
            id="artistName"
            >
                YouTube Playlist
            </div>


            <div
            class="progress-container"
            id="progressContainer"
            >

                <div
                class="progress"
                id="progress"
                ></div>

            </div>


            <div class="time-display">

                <span id="currentSongTime">
                    0:00
                </span>

                /

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="controls">


            <button
            class="control"
            id="previous"
            title="Previous"
            >
                |◀
            </button>


            <button
            class="control play-button"
            id="playButton"
            title="Play"
            >
                ▶
            </button>


            <button
            class="control"
            id="next"
            title="Next"
            >
                ▶|
            </button>


        </div>

    </div>

</main>


<!-- =====================================================
     YOUTUBE API
===================================================== -->

<script
src="https://www.youtube.com/iframe_api">
</script>


<script>

/* =====================================================
   YOUTUBE PLAYLIST
===================================================== */

const PLAYLIST_ID =
"PLVeY0XJJSxJMh2rXK2Taby1v23kj3P5_N";


let player = null;

let playerReady = false;

let isPlaying = false;


/* =====================================================
   ELEMENTS
===================================================== */

const startScreen =
document.getElementById("startScreen");

const enterButton =
document.getElementById("enterButton");

const playButton =
document.getElementById("playButton");

const previousButton =
document.getElementById("previous");

const nextButton =
document.getElementById("next");

const album =
document.getElementById("album");

const albumImage =
document.getElementById("albumImage");

const songName =
document.getElementById("songName");

const artistName =
document.getElementById("artistName");

const progress =
document.getElementById("progress");

const progressContainer =
document.getElementById("progressContainer");

const currentSongTime =
document.getElementById("currentSongTime");

const duration =
document.getElementById("duration");

const loading =
document.getElementById("loading");


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady() {


    player =
    new YT.Player(
        "youtube-player",
        {

            width: "1",

            height: "1",

            playerVars: {

                autoplay: 0,

                controls: 0,

                disablekb: 1,

                fs: 0,

                modestbranding: 1,

                rel: 0,

                playsinline: 1,

                listType:
                    "playlist",

                list:
                    PLAYLIST_ID
            },


            events: {

                onReady:
                    onPlayerReady,

                onStateChange:
                    onPlayerStateChange,

                onError:
                    onPlayerError

            }

        }
    );

}


/* =====================================================
   PLAYER READY
===================================================== */

function onPlayerReady() {

    playerReady = true;

    loading.classList.add("hide");

    setTimeout(
        updateSongInformation,
        1000
    );

}


/* =====================================================
   PLAYER STATE
===================================================== */

function onPlayerStateChange(event) {


    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "❚❚";

        album.classList.add(
            "playing"
        );

        updateSongInformation();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

        album.classList.remove(
            "playing"
        );

    }


    else if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

        album.classList.remove(
            "playing"
        );

    }

}


/* =====================================================
   YOUTUBE ERROR
===================================================== */

function onPlayerError(event) {

    console.log(
        "YouTube Player Error:",
        event.data
    );

}


/* =====================================================
   ENTER WEBSITE + START MUSIC
===================================================== */

enterButton.addEventListener(
"click",
function() {


    startScreen.classList.add(
        "hidden"
    );


    if (
        playerReady &&
        player
    ) {

        player.playVideo();

        isPlaying = true;

        playButton.textContent =
            "❚❚";

        album.classList.add(
            "playing"
        );

    }

});


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
"click",
function() {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    if (isPlaying) {

        player.pauseVideo();

    }

    else {

        player.playVideo();

    }

});


/* =====================================================
   NEXT SONG
===================================================== */

nextButton.addEventListener(
"click",
function() {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    player.nextVideo();


    setTimeout(
        updateSongInformation,
        800
    );

});


/* =====================================================
   PREVIOUS SONG
===================================================== */

previousButton.addEventListener(
"click",
function() {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    player.previousVideo();


    setTimeout(
        updateSongInformation,
        800
    );

});


/* =====================================================
   SONG INFORMATION
===================================================== */

function updateSongInformation() {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    try {


        const videoData =
        player.getVideoData();


        if (
            videoData &&
            videoData.title
        ) {

            songName.textContent =
                videoData.title;

        }


        if (
            videoData &&
            videoData.author
        ) {

            artistName.textContent =
                videoData.author;

        }


        if (
            videoData &&
            videoData.video_id
        ) {

            albumImage.src =
            `https://i.ytimg.com/vi/${videoData.video_id}/hqdefault.jpg`;

        }

    }

    catch(error) {

        console.log(error);

    }

}


/* =====================================================
   PROGRESS
===================================================== */

setInterval(
function() {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    try {


        const total =
        player.getDuration();


        const current =
        player.getCurrentTime();


        if (!total) {
            return;
        }


        const percent =
        (current / total) * 100;


        progress.style.width =
            percent + "%";


        currentSongTime.textContent =
            formatTime(current);


        duration.textContent =
            formatTime(total);


    }

    catch(error) {

        console.log(error);

    }


},
500
);


/* =====================================================
   SEEK
===================================================== */

progressContainer.addEventListener(
"click",
function(event) {


    if (
        !playerReady ||
        !player
    ) {
        return;
    }


    const width =
    progressContainer.clientWidth;


    const position =
    event.offsetX;


    const total =
    player.getDuration();


    if (!total) {
        return;
    }


    player.seekTo(
        (position / width) * total,
        true
    );

});


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(seconds) {


    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
    Math.floor(
        seconds / 60
    );


    const secondsLeft =
    Math.floor(
        seconds % 60
    );


    return (
        minutes +
        ":" +
        String(secondsLeft)
        .padStart(2, "0")
    );

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {


    const now =
    new Date();


    let hours =
    now.getHours();


    const minutes =
    String(
        now.getMinutes()
    ).padStart(
        2,
        "0"
    );


    const ampm =
    hours >= 12
        ? "pm"
        : "am";


    hours =
    hours % 12 || 12;


    document.getElementById(
        "currentTime"
    ).textContent =
        `${hours}:${minutes} ${ampm}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =====================================================
   ONLINE COUNTER
===================================================== */

function updateOnline() {


    const count =
    Math.floor(
        Math.random() * 12
    ) + 35;


    document.getElementById(
        "onlineCount"
    ).textContent =
        count;

}


updateOnline();


setInterval(
    updateOnline,
    15000
);

</script>
