<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>राजा हिन्दुस्तानी</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@700;800;900&display=swap"
rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden !important;

    position: fixed;

    inset: 0;

    background: #111;

    overscroll-behavior: none;

    font-family: Arial, sans-serif;
}


/* =========================================================
   MAIN
========================================================= */

.hero {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    isolation: isolate;
}


/* =========================================================
   BACKGROUND — NEVER MOVES
========================================================= */

.background {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background-image:
        linear-gradient(
            rgba(10, 5, 2, .08),
            rgba(10, 5, 2, .18)
        ),
        url("bg.png");

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    z-index: -10;

    pointer-events: none;
}


/* =========================================================
   DARK VIGNETTE
========================================================= */

.vignette {

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.25) 100%
        );

    z-index: -5;
}


/* =========================================================
   TOP BAR
========================================================= */

.top-bar {

    position: fixed;

    z-index: 20;

    top: 27px;

    left: 28px;

    right: 28px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    color: white;

    pointer-events: none;
}


.time {

    font-size: 16px;

    font-weight: 600;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8);
}


.online {

    position: absolute;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 15px;

    font-weight: 600;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8);
}


.online-dot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background: #18e88a;

    box-shadow:
        0 0 10px #18e88a;
}


.music-links {

    display: flex;

    align-items: center;

    gap: 25px;

    pointer-events: auto;
}


.music-links a {

    color: white;

    text-decoration: none;

    font-size: 14px;

    font-weight: 600;

    display: flex;

    align-items: center;

    gap: 7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.8);

    transition: .2s;
}


.music-links a:hover {

    opacity: .7;

}


/* =========================================================
   TITLE WRAPPER
========================================================= */

.title-container {

    position: fixed;

    z-index: 15;

    top: 43px;

    left: 50%;

    width: 100%;

    transform:
        translateX(-50%)
        translateY(0)
        scaleY(1);

    transform-origin: center center;

    will-change:
        transform;

    pointer-events: none;

}


/* =========================================================
   RAJA HINDUSTANI
========================================================= */

.title {

    font-family:
        "Noto Serif Devanagari",
        serif;

    font-size:
        clamp(75px, 9.5vw, 155px);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -5px;

    text-align: center;

    color: #fff4d5;

    text-shadow:

        2px 2px 0 #4b351e,

        5px 5px 0 #4b351e,

        8px 8px 0 rgba(0,0,0,.45),

        0 12px 25px rgba(0,0,0,.5);

}


/* =========================================================
   YOUTUBE PLAYER — HIDDEN
========================================================= */

#youtube-player {

    position: fixed;

    width: 1px;
    height: 1px;

    left: -100px;
    top: -100px;

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   MUSIC PLAYER
========================================================= */

.player {

    position: fixed;

    z-index: 30;

    left: 50%;

    bottom: 55px;

    width:
        min(670px, calc(100% - 30px));

    min-height: 92px;

    transform:
        translateX(-50%)
        translateY(0)
        scaleY(1);

    transform-origin: center center;

    will-change:
        transform;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 14px 10px 10px;

    border-radius: 24px;


    /* Transparent color taken from the warm background */

    background:
        linear-gradient(
            110deg,
            rgba(82,52,32,.66),
            rgba(135,65,42,.63),
            rgba(176,70,49,.58)
        );


    border:
        1px solid
        rgba(255,220,180,.28);


    box-shadow:

        0 12px 35px
        rgba(0,0,0,.35),

        inset 0 1px 1px
        rgba(255,255,255,.16);


    backdrop-filter:
        blur(8px)
        saturate(120%);

    -webkit-backdrop-filter:
        blur(8px)
        saturate(120%);
}


/* =========================================================
   ALBUM
========================================================= */

.album {

    width: 68px;

    height: 68px;

    flex-shrink: 0;

    overflow: hidden;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.35);

    box-shadow:
        0 4px 15px rgba(0,0,0,.4);
}


.album img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* =========================================================
   SONG INFO
========================================================= */

.song-info {

    flex: 1;

    min-width: 0;
}


.song-name {

    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 4px;
}


.artist {

    font-size: 12px;

    opacity: .72;

    margin-bottom: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container {

    width: 100%;

    height: 4px;

    background:
        rgba(255,255,255,.25);

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;
}


.progress {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;
}


.time-display {

    margin-top: 4px;

    font-size: 9px;

    opacity: .65;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    gap: 3px;
}


.control {

    width: 30px;

    height: 40px;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 13px;
}


.play-button {

    width: 52px;

    height: 52px;

    border-radius: 50%;

    background: rgba(255,255,255,.96);

    color: #3e2818;

    font-size: 18px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.25);
}


/* =========================================================
   START SCREEN
========================================================= */

.start-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(15,8,4,.65);

    backdrop-filter: blur(10px);

    transition:
        opacity .7s ease;
}


.start-screen.hidden {

    opacity: 0;

    pointer-events: none;
}


.start-content {

    text-align: center;

    color: white;
}


.start-content h2 {

    font-family:
        "Noto Serif Devanagari",
        serif;

    font-size:
        clamp(50px,7vw,90px);

    line-height: .9;

    color: #fff2d0;

    text-shadow:

        3px 3px 0 #49341f,

        6px 6px 0 rgba(0,0,0,.5);

    margin-bottom: 20px;
}


.start-content p {

    opacity: .75;

    font-size: 14px;

    margin-bottom: 25px;
}


.enter-button {

    padding:
        14px 30px;

    border:
        1px solid
        rgba(255,255,255,.45);

    border-radius: 40px;

    color: white;

    background:
        rgba(255,255,255,.12);

    cursor: pointer;

    font-weight: 700;

    transition: .25s;
}


.enter-button:hover {

    background: white;

    color: #352416;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px) {

    .top-bar {

        top: 17px;

        left: 17px;

        right: 17px;

    }


    .music-links {

        gap: 10px;

    }


    .music-links span {

        display: none;

    }


    .title-container {

        top: 42px;

    }


    .title {

        font-size: 61px;

        letter-spacing: -3px;

    }


    .player {

        width:
            calc(100% - 20px);

        bottom: 25px;

        min-height: 70px;

        border-radius: 18px;

        padding: 7px;

    }


    .album {

        width: 52px;

        height: 52px;

    }


    .song-name {

        font-size: 12px;

    }


    .artist {

        font-size: 9px;

    }


    .play-button {

        width: 42px;

        height: 42px;

    }

}

</style>
</head>


<body>


<!-- =========================================================
     FIXED BACKGROUND
========================================================= -->

<div class="background"></div>

<div class="vignette"></div>


<!-- =========================================================
     START SCREEN
========================================================= -->

<div
class="start-screen"
id="startScreen"
>

    <div class="start-content">

        <h2>
            राजा
            <br>
            हिन्दुस्तानी
        </h2>

        <p>
            Put on your headphones and enter the memory
        </p>

        <button
        class="enter-button"
        id="enterButton"
        >
            ▶ ENTER EXPERIENCE
        </button>

    </div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="hero">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="top-bar">


        <div
        class="time"
        id="currentTime"
        >
            4:40 pm
        </div>


        <div class="online">

            <span class="online-dot"></span>

            <span>

                <span id="onlineCount">
                    24
                </span>

                online

            </span>

        </div>


        <div class="music-links">

            <a
            href="https://open.spotify.com/"
            target="_blank"
            >
                ◉
                <span>Spotify ↗</span>
            </a>


            <a
            href="https://music.youtube.com/"
            target="_blank"
            >
                ▶
                <span>YT Music ↗</span>
            </a>

        </div>

    </div>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div
    class="title-container"
    id="titleContainer"
    >

        <h1 class="title">

            राजा

            <br>

            हिन्दुस्तानी

        </h1>

    </div>


    <!-- =====================================================
         YOUTUBE
    ====================================================== -->

    <div id="youtube-player"></div>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <div
    class="player"
    id="musicPlayer"
    >


        <div class="album">

            <img
            id="albumImage"
            src="bg.png"
            alt="Raja Hindustani"
            >

        </div>


        <div class="song-info">


            <div
            class="song-name"
            id="songName"
            >
                Raja Hindustani
            </div>


            <div
            class="artist"
            id="artistName"
            >
                YouTube Playlist
            </div>


            <div
            class="progress-container"
            id="progressContainer"
            >

                <div
                class="progress"
                id="progress"
                ></div>

            </div>


            <div class="time-display">

                <span id="currentSongTime">
                    0:00
                </span>

                /

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <div class="controls">


            <button
            class="control"
            id="previous"
            >
                |◀
            </button>


            <button
            class="play-button"
            id="playButton"
            >
                ▶
            </button>


            <button
            class="control"
            id="next"
            >
                ▶|
            </button>

        </div>

    </div>

</main>


<!-- =========================================================
     YOUTUBE API
========================================================= -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =========================================================
   PLAYLIST
========================================================= */

const PLAYLIST_ID =
"PLVeY0XJJSxJMh2rXK2Taby1v23kj3P5_N";


let player = null;

let playerReady = false;

let isPlaying = false;


/* =========================================================
   ELEMENTS
========================================================= */

const startScreen =
document.getElementById("startScreen");

const enterButton =
document.getElementById("enterButton");

const playButton =
document.getElementById("playButton");

const previous =
document.getElementById("previous");

const next =
document.getElementById("next");

const titleContainer =
document.getElementById("titleContainer");

const musicPlayer =
document.getElementById("musicPlayer");

const albumImage =
document.getElementById("albumImage");

const songName =
document.getElementById("songName");

const artistName =
document.getElementById("artistName");

const progress =
document.getElementById("progress");

const progressContainer =
document.getElementById("progressContainer");

const currentSongTime =
document.getElementById("currentSongTime");

const duration =
document.getElementById("duration");


/* =========================================================
   =========================================================
   STRETCH EFFECT
   =========================================================
========================================================= */


/*

   This is the important part.

   Mouse wheel UP:
       elements stretch upward.

   Mouse wheel DOWN:
       elements stretch downward.

   When wheel stops:
       they smoothly return to original position.

*/


let stretch = 0;

let targetStretch = 0;

let lastWheelTime = 0;


/* Maximum movement */

const MAX_STRETCH = 85;


/* How strongly wheel moves the design */

const WHEEL_POWER = 0.45;


/* =========================================================
   MOUSE WHEEL
========================================================= */

window.addEventListener(
    "wheel",
    function(event) {

        /*
           Prevent actual page scrolling.
        */

        event.preventDefault();


        /*
           deltaY:

           negative = scroll UP
           positive = scroll DOWN
        */


        targetStretch +=
            event.deltaY * WHEEL_POWER;


        /*
           Limit movement.
        */

        targetStretch =
            Math.max(
                -MAX_STRETCH,
                Math.min(
                    MAX_STRETCH,
                    targetStretch
                )
            );


        lastWheelTime =
            performance.now();

    },
    {
        passive: false
    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animateStretch(time) {


    /*
       If mouse wheel hasn't been used
       for a short moment, return to center.
    */

    if (
        time - lastWheelTime > 55
    ) {

        targetStretch *= 0.82;

    }


    /*
       Smooth movement.
    */

    stretch +=
        (targetStretch - stretch) * 0.16;


    /*
       If very close to center,
       force zero.
    */

    if (
        Math.abs(stretch) < 0.05 &&
        Math.abs(targetStretch) < 0.05
    ) {

        stretch = 0;

        targetStretch = 0;

    }


    /*
       Direction:

       negative = UP
       positive = DOWN
    */


    const direction =
        stretch < 0
            ? -1
            : 1;


    const distance =
        Math.abs(stretch);


    /*
       Stretch amount.

       The further you scroll,
       the taller the stretch becomes.
    */

    const scale =
        1 + distance * 0.0025;


    /* =====================================================
       TITLE
    ===================================================== */

    titleContainer.style.transform =

        `translateX(-50%)
         translateY(${stretch}px)
         scaleY(${scale})`;


    /* =====================================================
       MUSIC PLAYER
    ===================================================== */

    musicPlayer.style.transform =

        `translateX(-50%)
         translateY(${stretch * 0.72}px)
         scaleY(${1 + distance * 0.0018})`;


    requestAnimationFrame(
        animateStretch
    );

}


requestAnimationFrame(
    animateStretch
);


/* =========================================================
   YOUTUBE
========================================================= */

function onYouTubeIframeAPIReady() {

    player =
        new YT.Player(
            "youtube-player",
            {

                width: "1",

                height: "1",

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    disablekb: 1,

                    fs: 0,

                    modestbranding: 1,

                    rel: 0,

                    playsinline: 1,

                    listType: "playlist",

                    list: PLAYLIST_ID

                },

                events: {

                    onReady:
                        onPlayerReady,

                    onStateChange:
                        onPlayerStateChange

                }

            }
        );

}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady() {

    playerReady = true;

}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.PLAYING
    ) {

        isPlaying = true;

        playButton.textContent =
            "❚❚";

        updateSongInformation();

    }


    else if (
        event.data ===
        YT.PlayerState.PAUSED
    ) {

        isPlaying = false;

        playButton.textContent =
            "▶";

    }

}


/* =========================================================
   ENTER
========================================================= */

enterButton.addEventListener(
    "click",
    function() {

        startScreen.classList.add(
            "hidden"
        );


        if (
            playerReady
        ) {

            player.playVideo();

        }

    }
);


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.addEventListener(
    "click",
    function() {

        if (
            !playerReady
        ) {

            return;

        }


        if (
            isPlaying
        ) {

            player.pauseVideo();

        }

        else {

            player.playVideo();

        }

    }
);


/* =========================================================
   NEXT
========================================================= */

next.addEventListener(
    "click",
    function() {

        if (playerReady) {

            player.nextVideo();

        }

    }
);


/* =========================================================
   PREVIOUS
========================================================= */

previous.addEventListener(
    "click",
    function() {

        if (playerReady) {

            player.previousVideo();

        }

    }
);


/* =========================================================
   SONG INFO
========================================================= */

function updateSongInformation() {

    if (
        !playerReady ||
        !player
    ) {

        return;

    }


    try {

        const data =
            player.getVideoData();


        if (
            data &&
            data.title
        ) {

            songName.textContent =
                data.title;

        }


        if (
            data &&
            data.author
        ) {

            artistName.textContent =
                data.author;

        }


        if (
            data &&
            data.video_id
        ) {

            albumImage.src =
                `https://i.ytimg.com/vi/${data.video_id}/hqdefault.jpg`;

        }

    }

    catch(error) {

        console.log(error);

    }

}


/* =========================================================
   PROGRESS
========================================================= */

setInterval(
    function() {

        if (
            !playerReady ||
            !player
        ) {

            return;

        }


        try {

            const total =
                player.getDuration();


            const current =
                player.getCurrentTime();


            if (!total) {

                return;

            }


            const percent =
                (current / total) * 100;


            progress.style.width =
                percent + "%";


            currentSongTime.textContent =
                formatTime(current);


            duration.textContent =
                formatTime(total);

        }

        catch(error) {}

    },
    500
);


/* =========================================================
   SEEK
========================================================= */

progressContainer.addEventListener(
    "click",
    function(event) {

        if (
            !playerReady ||
            !player
        ) {

            return;

        }


        const width =
            progressContainer.clientWidth;


        const position =
            event.offsetX;


        const total =
            player.getDuration();


        if (!total) {

            return;

        }


        player.seekTo(
            position / width * total,
            true
        );

    }
);


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(seconds / 60);


    const secs =
        Math.floor(seconds % 60);


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(2, "0")
    );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const ampm =
        hours >= 12
            ? "pm"
            : "am";


    hours =
        hours % 12 || 12;


    document.getElementById(
        "currentTime"
    ).textContent =
        `${hours}:${minutes} ${ampm}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================================================
   ONLINE COUNT
========================================================= */

function updateOnline() {

    const count =
        Math.floor(
            Math.random() * 8
        ) + 20;


    document.getElementById(
        "onlineCount"
    ).textContent =
        count;

}


updateOnline();


setInterval(
    updateOnline,
    15000
);


/* =========================================================
   PREVENT TOUCH SCROLL
========================================================= */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================================
   PREVENT KEYBOARD SCROLL
========================================================= */

window.addEventListener(
    "keydown",
    function(event) {

        const keys = [
            "ArrowUp",
            "ArrowDown",
            "PageUp",
            "PageDown",
            "Home",
            "End",
            " "
        ];


        if (
            keys.includes(
                event.key
            )
        ) {

            event.preventDefault();

        }

    }
);


/* =========================================================
   ALWAYS STAY AT SCROLL TOP
========================================================= */

window.scrollTo(
    0,
    0
);

</script>

</body>
</html>
